[package]
name = "pain-loader"
version = "0.1.0"
edition = "2021"
description = "Лоадер Pain Client: вход в аккаунт, установка и обновление Free и Alpha"

[dependencies]
# без TLS: сервер пока работает по обычному HTTP; когда появится HTTPS, сюда добавится feature "tls"
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
