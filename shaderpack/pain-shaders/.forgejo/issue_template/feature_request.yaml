name: Feature Request
about: File a feature request
ref: 'main'
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: You can attach an image here when you click the text box.
      placeholder: Describe the feature you want here.
    validations:
      required: true