name: Bug Report
about: File a bug report
ref: 'main'
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Make sure you fill it out carefully in order to have your issue fixed quicker!
  - type: textarea
    id: issue-description
    attributes:
      label: Issue description
      description: You can attach an image here when you click the text box.
      placeholder: Describe your issue here.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      placeholder: A list of your mods (besides the ones used to load the shader). Attaching an image of your mods folder is also fine.
  - type: checkboxes
    id: shaderloader
    attributes:
      label: Shader Loader
      description: Which loader does this issue happen with?
      options:
        - label: Iris
        - label: Optifine
  - type: textarea
    id: f3menu
    attributes:
      label: F3 screenshot
      placeholder: Attach a game screenshot with the F3 menu open. Make sure the text isn't cut off.
    validations:
      required: true