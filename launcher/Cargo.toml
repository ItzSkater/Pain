[package]
name = "pain-launcher"
version = "0.1.0"
edition = "2021"
description = "Лаунчер Pain Client: аккаунт, установка Minecraft с Fabric и клиента, запуск игры"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
