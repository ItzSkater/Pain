plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-beta15'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Версия клиента: alpha (по умолчанию, всё включено) или free. Задаётся так: ./gradlew build -Pedition=free
// Редакций больше нет: клиент распространяется под GPLv3 одной сборкой со всеми модулями.
// Переменная и флаг Edition.ALPHA оставлены, чтобы не трогать код, который на них смотрит.
def edition = 'alpha'
if (!(edition in ['free', 'alpha'])) {
    throw new GradleException("edition должен быть free или alpha, а не '${edition}'")
}
def editionDir = layout.buildDirectory.dir("generated/edition")

// Классы модулей, которых в версии Free нет совсем: их просто не кладём в jar
def alphaOnlyClasses = [
    'tech/pain/client/modules/impl/movement/Scaffold',
    'tech/pain/client/modules/impl/combat/ElytraTarget',
    'tech/pain/client/modules/impl/player/BaseFinder',
    'tech/pain/client/modules/impl/player/ChestSorter',
    'tech/pain/client/modules/impl/render/HitEffect',
    'tech/pain/client/modules/impl/render/JumpEffect',
    'tech/pain/client/modules/impl/render/Thunder',
    'tech/pain/client/modules/impl/render/MotionBlur',
    'tech/pain/client/modules/impl/render/BlockESP',
    'tech/pain/client/modules/impl/render/StorageESP',
    'tech/pain/client/modules/impl/render/Minimap',
]

tasks.register('generateEdition') {
    inputs.property('edition', edition)
    outputs.dir(editionDir)
    doLast {
        def file = editionDir.get().file('tech/pain/Edition.java').asFile
        file.parentFile.mkdirs()
        file.text = """package tech.pain;

/** Версия клиента. Файл создаётся при сборке (см. build.gradle, параметр -Pedition). */
public final class Edition {
   public static final boolean ALPHA = ${edition == 'alpha'};
   public static final String NAME = "Client";

   private Edition() {
   }
}
"""
    }
}
sourceSets.main.java.srcDir(editionDir)
tasks.named('compileJava') { dependsOn('generateEdition') }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn('generateEdition') }

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org/snapshots" }
    maven { url "https://maven.meteordev.org" }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    modImplementation("meteordevelopment:baritone:1.21.4-SNAPSHOT")
    include("meteordevelopment:baritone:1.21.4-SNAPSHOT")
    include implementation("meteordevelopment:discord-ipc:1.1")
    include implementation("meteordevelopment:orbit:0.2.3")
    implementation(shadow("dev.redstones.mediaplayerinfo:media-player-info:0.1.0"))
    compileOnly(files("libs/mcpfabric-0.5.0+1.21.4.jar"))
    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (21 >= 10 || JavaVersion.current().isJava10Compatible()) it.options.release.set(21)
}

loom {
    accessWidenerPath = file("src/main/resources/pain.accesswidener")
}

java {
    def javaVersion = JavaVersion.toVersion(21)
    if (JavaVersion.current() < javaVersion) toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

shadowJar {
    exclude("org/objectweb/**")
    if (edition == 'free') {
        alphaOnlyClasses.each { exclude("${it}.class"); exclude("${it}\$*.class") }
        // звук грозы нужен только модулю Thunder
        exclude("assets/pain/sounds/**")
        exclude("assets/pain/sounds.json")
    }
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev")
}

remapJar {
    dependsOn(shadowJar)
    inputFile = tasks.shadowJar.archiveFile
    // обычная сборка (alpha) называется как раньше; free — отдельным файлом рядом
    archiveFileName = edition == 'alpha' ? "Pain.v${project.mod_version}.jar" : "Pain-Free.v${project.mod_version}.jar"
}
